            color: white;

        }

        .btn-qty:hover {

        }

<body>

<div class="container mt-3">
<div class="row menu">

<script>
var menu = [
    {nama:"GEL PEN Hi-Tech-H 0.28 Mm Kenko", harga:5000, harga_pack:45000, isi_pack:10, gambar:"kenko.webp"},
    {nama:"Pensil Faber Castle 2B", harga:3000, harga_pack:25000, isi_pack:10, gambar:"faber.jpeg"},
    {nama:"Buku Tulis Big Boss (36 lembar)", harga:7000, harga_pack:60000, isi_pack:10, gambar:"bigboss.jpeg"},
    {nama:"Spidol Hitam Snowman", harga:8000, harga_pack:70000, isi_pack:10, gambar:"spidol.webp"},
    {nama:"Penghapus Joyko 526 B40", harga:2000, harga_pack:15000, isi_pack:10, gambar:"penghapus.jpg"},
    {nama:"Penggaris Butterfly 30cm", harga:4000, harga_pack:35000, isi_pack:10, gambar:"penggaris.png"},
    {nama:"Stabilo Boss (per pcs= random color)", harga:15000, harga_pack:130000, isi_pack:9, gambar:"stabilo.png"},
    {nama:"Binder Notebook B5 BNT 908 Topla", harga:15000, harga_pack:130000, isi_pack:5, gambar:"binder.jpg"},
    {nama:"Sticky Notes BIG 76 x 76mm 4W", harga:6000, harga_pack:50000, isi_pack:8, gambar:"sticky.jpeg"}
];

for(let i=0;i<menu.length;i++){
    document.write(`
    <div class="col-md-4 mb-4">
        <div class="card p-2">
            <img src="${menu[i].gambar}">
            <h5>${menu[i].nama}</h5>

            <p id="harga${i}">Rp ${menu[i].harga}</p>

            <div id="info${i}" class="badge-pack">
                1 pack = ${menu[i].isi_pack} pcs
            </div>

            Pilih:
            <select class="form-control mt-2" id="tipe${i}" onchange="ubahHarga(${i})">
                <option value="pcs">Per Pcs</option>
                <option value="pack">Per Pack</option>
            </select>

            Jumlah:
            <div class="d-flex justify-content-center align-items-center mt-2">
                <button class="btn-qty" onclick="kurang(${i})">−</button>
                <span id="item${i}" style="margin: 0 10px;">0</span>
                <button class="btn-qty" onclick="tambah(${i})">+</button>
            </div>
        </div>
    </div>
    `);
}
</script>

</div>
</div>

<div class="container mt-4 mb-5">
    <h4>Pemesanan</h4>

    Nama:
    <input type="text" id="nama" class="form-control" oninput="cekForm()"><br>

    Tanggal:
    <input type="date" id="tanggal" class="form-control" onchange="cekForm()"><br>

    Pengambilan:
    <select id="ambil" class="form-control" onchange="toggleAlamat()">
        <option value="toko">Ambil di toko</option>
        <option value="antar" id="opsiAntar">Diantar ke rumah</option>
    </select><br>

    <div id="alamatBox" style="display:none;">
        Alamat:
        <textarea id="alamat" class="form-control" oninput="cekForm()" placeholder="Masukkan alamat lengkap"></textarea><br>
    </div>

    <h5>Total: Rp <span id="total">0</span></h5>
</div>

<!--Pembayaran-->
<div class="container mb-5">
<div class="payment-container">
  <h3>Pilih Metode Pembayaran</h3>

  <button onclick="showPayment('qris')" class="btn btn-custom">QRIS</button>
  <button onclick="showPayment('transfer')" class="btn btn-custom">Transfer</button>
  <button onclick="showPayment('tunai')" class="btn btn-custom">Tunai</button>

  <div id="payment-result"></div>
</div>
</div>

<div class="container mt-4 mb-5">
  <button id="btnPesan" class="btn btn-pink" onclick="pesan()">Pesan Sekarang</button>
</div>

<script>
var metodePembayaran = "";

function cekForm(){
    let nama = document.getElementById("nama").value.trim();
    let tanggal = document.getElementById("tanggal").value;
    let ambil = document.getElementById("ambil").value;
    let alamat = document.getElementById("alamat").value.trim();
    let btn = document.getElementById("btnPesan");

    if(
        nama === "" ||
        tanggal === "" ||
        (ambil === "antar" && alamat === "")
    ){
        btn.disabled = true;
        btn.innerText = "Lengkapi data dulu!";
    } else {
        btn.disabled = false;
        btn.innerText = "Pesan Sekarang";
    }
}

function toggleAlamat(){
    let ambil = document.getElementById("ambil").value;
    let box = document.getElementById("alamatBox");

    if(ambil === "antar"){
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }

    cekForm();
}

function ubahHarga(i){
    let tipe = document.getElementById("tipe"+i).value;
    let hargaText = document.getElementById("harga"+i);
    let infoText = document.getElementById("info"+i);

    let harga = (tipe === "pcs") ? menu[i].harga : menu[i].harga_pack;

    hargaText.innerText = "Rp " + harga;

    if(tipe === "pack"){
        infoText.innerText = "1 pack = " + menu[i].isi_pack + " pcs";
    } else {
        infoText.innerText = "Dijual per pcs";
    }

    hitung();
}

function hitung(){
    let total = 0;

    for(let i=0;i<menu.length;i++){
        let jumlah = parseInt(document.getElementById("item"+i).innerText);
        let tipe = document.getElementById("tipe"+i).value;

        let harga = (tipe === "pcs") 
            ? menu[i].harga 
            : menu[i].harga_pack;

        total += jumlah * harga;
    }

    document.getElementById("total").innerText = total;
}

function tambah(i){
    let el = document.getElementById("item"+i);
    let jumlah = parseInt(el.innerText);
    jumlah++;
    el.innerText = jumlah;
    hitung();
}

function kurang(i){
    let el = document.getElementById("item"+i);
    let jumlah = parseInt(el.innerText);
    if(jumlah > 0){
        jumlah--;
    }
    el.innerText = jumlah;
    hitung();
}

function showPayment(method) {
    let result = document.getElementById("payment-result");
    metodePembayaran = method;

    document.getElementById("opsiAntar").disabled = false;

    if (method === "qris") {
        result.innerHTML = `
        <div class="payment-box">
            <h4>QRIS</h4>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=BertulisShop" />
            <p>Scan QR untuk bayar</p>
        </div>`;
    }

    else if (method === "transfer") {
        result.innerHTML = `
        <div class="payment-box">
            <h4>Transfer Bank</h4>
            <p>No Rekening: <b>1234567890</b></p>
            <p>Bank: BCA</p>
            <p>Atas Nama: Bertulis Shop</p>
        </div>`;
    }

    else if (method === "tunai") {
        result.innerHTML = `
        <div class="payment-box">
            <h4>Tunai</h4>
            <p>Silakan bayar langsung di toko.</p>
        </div>`;

        document.getElementById("opsiAntar").disabled = true;
        document.getElementById("ambil").value = "toko";
        toggleAlamat();
    }
}

// disable saat awal load
window.onload = function(){
    cekForm();
}

function pesan(){
    var nama = document.getElementById("nama").value;
    var tanggal = document.getElementById("tanggal").value;
    var ambil = document.getElementById("ambil").value;
    var alamat = document.getElementById("alamat").value;
    var total = document.getElementById("total").innerText;

    alert(
        "Pesanan berhasil!\n\n" +
        "Nama: " + nama +
        "\nTanggal: " + tanggal +
        "\nPengambilan: " + ambil +
        "\nAlamat: " + (ambil === "antar" ? alamat : "-") +
        "\nTotal: Rp " + total +
        "\nMetode: " + metodePembayaran
    );
}
</script>

</body>
</html>
